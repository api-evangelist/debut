api: DEINDE Commerce (UCP MCP)
format: jsonrpc-2.0-error
rfc9457: false
note: >-
  The endpoint is JSON-RPC 2.0 over HTTP, not a REST API, so errors arrive as a JSON-RPC
  error object rather than an application/problem+json document. Debut publishes no error
  reference of its own; the entries below are what was actually observed on the wire plus
  the one failure mode its published agent instructions name explicitly. This is an
  incomplete catalog by construction — only errors that could be triggered without moving
  money were probed.

envelope:
  transport_status: HTTP status is carried alongside the JSON-RPC error (422 observed on
    a semantic failure, 200 on success)
  shape: |
    {"jsonrpc":"2.0","id":<id>,"error":{"code":<int>,"message":"<string>",
     "data":{"code":"<machine_slug>","content":"<detail>","continue_url":"<url>"}}}
  machine_readable_field: error.data.code
  human_readable_field: error.message
  recovery_hint_field: error.data.continue_url

errors:

