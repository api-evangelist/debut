aid: debut
name: Debut
description: 'Debut (Debut Biotechnology, Inc.) is a San Diego, California biotechnology
  company founded in 2019 by Dr. Joshua Britton that combines AI-driven molecular discovery,
  skin genomics and cell-free biomanufacturing to create novel cosmetic active ingredients
  and finished skincare formulations. Its BeautyORB platform screens billions of candidate
  molecules in silico against a skin-health genomic dataset, and the company is vertically
  integrated from discovery through fermentation, scale-up and formulation, selling
  ingredients and brand-ready products to beauty manufacturers as well as running its
  own direct-to-consumer skincare brand, DEINDE. Debut has raised roughly $89M across
  Series A, Series B (led by BOLD, the L''Oreal venture fund) and later rounds, employs
  more than 80 people, and was named to the TIME100 Most Innovative Companies 2025.
  Debut sells molecules and formulations rather than software: debutbiotech.com publishes
  no developer program, no public API and no machine-readable API contract. Its only
  agent-reachable API surface is the Shopify-hosted Universal Commerce Protocol (UCP)
  MCP endpoint on its DEINDE storefront at www.deinde.com, which is live, unauthenticated
  for catalog and cart operations, and returns full JSON Schema tool definitions.'
