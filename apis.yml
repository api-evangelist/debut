apis:
- name: DEINDE Commerce (UCP MCP)
  description: 'The agent-facing commerce API for Debut''s direct-to-consumer skincare
    brand DEINDE. It is a Shopify-hosted Universal Commerce Protocol (UCP) service exposed
    over MCP at https://www.deinde.com/api/ucp/mcp, advertised by the store''s own
    /llms.txt, /agents.md and /.well-known/ucp documents. An anonymous tools/list call
    returns 13 tools with complete JSON Schema inputs covering catalog search and lookup,
    cart lifecycle, checkout lifecycle and order retrieval. This is platform-provided
    commerce plumbing served from Debut''s own host, not a first-party Debut engineering
    API — Debut publishes no OpenAPI and no developer portal of its own.'
