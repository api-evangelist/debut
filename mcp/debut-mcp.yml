- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier.
  arguments: [meta, catalog]
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier. Returns a singular product.
  arguments: [meta, catalog]
- name: create_cart
  category: cart
  description: Creates a new cart.
  arguments: [meta, cart]
- name: get_cart
  category: cart
  description: Get the cart contents.
  arguments: [meta, id]
- name: update_cart
  category: cart
  description: Perform updates to a cart.
  arguments: [meta, cart, id]
- name: cancel_cart
  category: cart
  description: Cancels a cart.
  arguments: [meta, id]
- name: create_checkout
  category: checkout
  description: Creates a checkout. Returns checkout details, including line items, totals,
    discounts and taxes.
  arguments: [meta, checkout]
- name: get_checkout
  category: checkout
  description: Returns details about the checkout, including line items, totals, and
    any applicable discounts or taxes.
  arguments: [meta, id]
- name: update_checkout
  category: checkout
  description: Updates a checkout (shipping address, fulfillment method, payment).
  arguments: [meta, checkout, id]
- name: complete_checkout
  category: checkout
  description: Completes a checkout and returns the checkout result. Requires a buyer-approved
    payment and an idempotency key.
  arguments: [meta, checkout, id]
  idempotent: true
  idempotency_key: meta.idempotency-key
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
  arguments: [meta, id]
- name: get_order
  category: order
  description: Get the details of an order.
  arguments: [meta, id]

